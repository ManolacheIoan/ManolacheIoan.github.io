# Builds the static site and publishes it on GitHub Pages at every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # npm install instead of npm ci: npm ci rejects the lock file over optional WASM deps on Linux.
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          # Real address of the site, used for SEO, sitemap and social previews.
          NEXT_PUBLIC_SITE_URL: https://manolacheioan.github.io
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
