# Lint and build on every pull request (including Dependabot's), so a bad change shows
# a red check before merging. On main, a successful build is also published to GitHub Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # npm install instead of npm ci: npm ci rejects the lock file over optional WASM deps on Linux.
      - run: npm install --no-audit --no-fund
      # Stops the deploy if the code has lint errors. Type errors are caught by `next build`.
      - run: npm run lint
      - run: npm run build
        env:
          # Real address of the site, used for SEO, sitemap and social previews.
          NEXT_PUBLIC_SITE_URL: https://manolacheioan.github.io
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: out

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
